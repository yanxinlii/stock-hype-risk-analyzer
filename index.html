<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Hype Risk Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: { panel: '0 10px 40px -20px rgba(14, 165, 233, 0.45)' },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100" style="background-image: radial-gradient(circle at top, rgba(6, 182, 212, 0.18), transparent 35%);">
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18.3.1'
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client'
      import { ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip } from 'https://esm.sh/recharts@2.15.4'

      const historicalData = [
        { date: 'Apr 01', price: 168.1 }, { date: 'Apr 05', price: 171.9 }, { date: 'Apr 10', price: 166.2 },
        { date: 'Apr 14', price: 173.6 }, { date: 'Apr 19', price: 179.3 }, { date: 'Apr 23', price: 176.4 },
        { date: 'Apr 28', price: 183.8 }, { date: 'May 03', price: 186.5 },
      ]
      const sentimentData = [
        { source: 'X (Twitter)', score: 78, trend: '+11%' },
        { source: 'Reddit', score: 84, trend: '+18%' },
        { source: 'StockTwits', score: 72, trend: '+6%' },
      ]
      const kpis = [
        { label: '24h Price Change', value: '+3.24%', tone: 'text-emerald-300' },
        { label: '30d Volatility', value: '27.9%', tone: 'text-amber-300' },
        { label: 'Hype Score', value: '81 / 100', tone: 'text-cyan-300' },
        { label: 'Risk Level', value: 'Elevated', tone: 'text-rose-300' },
      ]

      function App() {
        return React.createElement('main', { className: 'mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-8 md:px-8' },
          React.createElement('header', { className: 'rounded-2xl border border-slate-800/70 bg-slate-900/60 p-6 shadow-panel backdrop-blur' },
            React.createElement('p', { className: 'mb-2 text-xs uppercase tracking-[0.2em] text-cyan-300' }, 'Portfolio Project'),
            React.createElement('h1', { className: 'text-2xl font-semibold md:text-3xl' }, 'Stock Hype Risk Analyzer')),
          React.createElement('section', { className: 'grid gap-4 sm:grid-cols-2 xl:grid-cols-4' },
            ...kpis.map((k) => React.createElement('article', { key: k.label, className: 'rounded-2xl border border-slate-800 bg-slate-900/70 p-5 shadow-panel' },
              React.createElement('p', { className: 'text-xs uppercase tracking-[0.15em] text-slate-400' }, k.label),
              React.createElement('p', { className: `mt-3 text-2xl font-semibold ${k.tone}` }, k.value)))),
          React.createElement('section', { className: 'grid gap-6 xl:grid-cols-[2fr_1fr]' },
            React.createElement('article', { className: 'rounded-2xl border border-slate-800 bg-slate-900/70 p-5 shadow-panel' },
              React.createElement('h2', { className: 'mb-4 text-lg font-semibold' }, 'Historical Price Trend'),
              React.createElement('div', { className: 'h-72' }, React.createElement(ResponsiveContainer, { width: '100%', height: '100%' },
                React.createElement(LineChart, { data: historicalData },
                  React.createElement(CartesianGrid, { strokeDasharray: '3 3', stroke: '#1e293b' }),
                  React.createElement(XAxis, { dataKey: 'date', stroke: '#94a3b8', tickLine: false, axisLine: false }),
                  React.createElement(YAxis, { stroke: '#94a3b8', tickLine: false, axisLine: false }),
                  React.createElement(Tooltip, { contentStyle: { backgroundColor: '#0f172a', borderColor: '#1e293b' } }),
                  React.createElement(Line, { type: 'monotone', dataKey: 'price', stroke: '#22d3ee', strokeWidth: 3 }))))),
            React.createElement('article', { className: 'rounded-2xl border border-slate-800 bg-slate-900/70 p-5 shadow-panel' },
              React.createElement('h2', { className: 'text-lg font-semibold' }, 'Social Sentiment Pulse'),
              ...sentimentData.map((s) => React.createElement('div', { key: s.source, className: 'mt-3 rounded-xl border border-slate-800 bg-slate-950/70 p-4' }, s.source + ' · ' + s.score + '/100 ' + s.trend)))),
          React.createElement('section', { className: 'rounded-2xl border border-rose-900/40 bg-gradient-to-r from-rose-950/40 to-slate-900/80 p-5 shadow-panel' },
            React.createElement('h2', { className: 'text-lg font-semibold text-rose-200' }, 'Risk Explanation'),
            React.createElement('p', { className: 'mt-3 text-sm leading-6 text-slate-300' },
              'Elevated risk is flagged because social sentiment is rising faster than price fundamentals, while volatility remains above baseline.')))
      }
      createRoot(document.getElementById('root')).render(React.createElement(App))
    </script>
  </body>
</html>
